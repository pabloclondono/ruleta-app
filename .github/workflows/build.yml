name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ruleta-windows
          - os: macos-latest
            artifact: ruleta-macos
          - os: ubuntu-latest
            artifact: ruleta-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install PyInstaller + PySide6
        run: pip install pyinstaller pyside6

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --clean --collect-all PySide6 --name ruleta ruleta.py

      - name: Build (macOS app bundle)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --clean --collect-all PySide6 --name ruleta ruleta.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --clean --collect-all PySide6 --name ruleta ruleta.py

      - name: Sign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/ruleta.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/ruleta.exe artifacts/ruleta-windows.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cd dist && ditto -c -k --keepParent ruleta.app ../artifacts/ruleta-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp dist/ruleta artifacts/ruleta-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true